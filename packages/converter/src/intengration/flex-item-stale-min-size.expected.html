<div
  data-id="toolbar"
  data-type="frame"
  style="
    position: relative;
    width: 240px;
    height: 48px;
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    justify-content: flex-start;
    row-gap: 0px;
    column-gap: 8px;
    padding: 0px;
    border-radius: 0px;
    background-color: #f8fafc;
  "
>
  <div
    data-id="chip-free"
    data-type="frame"
    style="
      width: 80px;
      height: 40px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      row-gap: 0px;
      column-gap: 8px;
      padding: 0px 12px 0px 12px;
      border-radius: 8px;
      background-color: #e5e7eb;
      overflow: hidden;
    "
  >
    <div
      data-id="chip-free-label"
      data-type="text"
      style="width: 56px; height: 17px; align-self: center; white-space: nowrap"
    >
      <p
        style="
          font-size: 14px;
          font-weight: 500;
          font-family: &quot;Arial&quot;;
          line-height: 1.2;
          text-align: left;
          text-transform: none;
          color: #111827;
        "
      >
        Free
      </p>
    </div>
  </div>
  <div
    data-id="chip-locked"
    data-type="frame"
    style="
      width: 100px;
      height: 40px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      row-gap: 0px;
      column-gap: 8px;
      padding: 0px 12px 0px 12px;
      border-radius: 8px;
      background-color: #1e3a8a;
      overflow: hidden;
    "
  >
    <div
      data-id="chip-locked-label"
      data-type="text"
      style="width: 56px; height: 17px; align-self: center; white-space: nowrap"
    >
      <p
        style="
          font-size: 14px;
          font-weight: 500;
          font-family: &quot;Arial&quot;;
          line-height: 1.2;
          text-align: left;
          text-transform: none;
          color: #ffffff;
        "
      >
        Locked
      </p>
    </div>
    <div
      data-id="chip-locked-dot"
      data-type="rect"
      style="
        width: 12px;
        height: 12px;
        align-self: center;
        border-radius: 6px;
        background-color: #facc15;
      "
    ></div>
  </div>
</div>
