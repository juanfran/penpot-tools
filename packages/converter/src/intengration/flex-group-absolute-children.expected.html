<div
  data-id="col-card"
  data-type="frame"
  style="
    position: relative;
    width: 220px;
    height: 180px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    gap: 12px;
    padding: 20px;
    border-radius: 8px;
    background-color: #eef2ff;
  "
>
  <div
    data-id="reading-group"
    data-type="group"
    style="width: 120px; height: 60px; margin: 0px; position: relative"
  >
    <div
      data-id="reading-big"
      data-type="text"
      style="
        position: absolute;
        left: 0px;
        top: 0px;
        width: 80px;
        height: 38px;
        width: 80px;
        height: 38px;
        white-space: nowrap;
      "
    >
      <p
        style="
          font-size: 32px;
          font-weight: 700;
          font-family: 'Arial';
          line-height: 1.2;
          text-align: left;
          text-transform: none;
          color: #1e3a8a;
        "
      >
        24°C
      </p>
    </div>
    <div
      data-id="reading-small"
      data-type="text"
      style="
        position: absolute;
        left: 0px;
        top: 42px;
        width: 120px;
        height: 18px;
        width: 120px;
        height: 18px;
        white-space: nowrap;
      "
    >
      <p
        style="
          font-size: 14px;
          font-weight: 400;
          font-family: 'Arial';
          line-height: 1.2;
          text-align: left;
          text-transform: none;
          color: #475569;
        "
      >
        +2° warmer
      </p>
    </div>
  </div>
  <div
    data-id="label-text"
    data-type="text"
    style="width: 100px; height: 18px; white-space: nowrap"
  >
    <p
      style="
        font-size: 14px;
        font-weight: 400;
        font-family: 'Arial';
        line-height: 1.2;
        text-align: left;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #334155;
      "
    >
      Today
    </p>
  </div>
</div>
