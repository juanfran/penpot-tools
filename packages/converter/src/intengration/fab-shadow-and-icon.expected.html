<div
  data-id="fab-root"
  data-type="frame"
  style="position: relative; width: 96px; height: 96px; overflow: hidden"
>
  <div
    data-id="fab-bg-layers"
    data-type="frame"
    style="
      position: absolute;
      left: 0px;
      top: 0px;
      width: 96px;
      height: 96px;
      overflow: hidden;
      box-shadow:
        0px 4px 4px 0px rgba(0, 0, 0, 0.05),
        0px 2px 2px 0px rgba(0, 0, 0, 0.09),
        0px 1px 1px 0px rgba(0, 0, 0, 0.16);
    "
  >
    <div
      data-id="fab-base-rect"
      data-type="rect"
      style="
        position: absolute;
        left: 0px;
        top: 0px;
        width: 96px;
        height: 96px;
        border-radius: 28px;
        background-color: #bfdbfe;
      "
    ></div>
    <div
      data-id="fab-tint-rect"
      data-type="rect"
      style="
        position: absolute;
        left: 0px;
        top: 0px;
        width: 96px;
        height: 96px;
        opacity: 0.11;
        border-radius: 28px;
        background-color: #1d4ed8;
      "
    ></div>
  </div>
  <div
    data-id="fab-inner"
    data-type="frame"
    style="
      position: absolute;
      left: 0px;
      top: 0px;
      width: 96px;
      height: 96px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 0px;
      padding: 30px;
      overflow: hidden;
    "
  >
    <svg
      data-id="fab-icon"
      data-type="group"
      width="36"
      height="36"
      viewBox="82 82 36 36"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      style="width: 36px; height: 36px; margin: 30px"
    >
      <path d="M91,86 L111,100 L91,114 Z" fill="#111827" />
    </svg>
  </div>
</div>
