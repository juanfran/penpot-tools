<div
  data-id="outer-row"
  style="
    position: relative;
    width: 400px;
    height: 300px;
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    justify-content: flex-start;
    gap: 0px;
    padding: 0px;
  "
>
  <div style="flex: 1; height: 100%">
    <div
      data-id="col-container"
      style="
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        gap: 0px;
        padding: 0px;
        background-color: #1a1a1a;
      "
    >
      <div style="width: 400px">
        <div
          data-id="fill-child"
          style="
            width: 400px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 0px;
            padding: 0px 20px 0px 20px;
          "
        >
          <div style="width: 400px; height: 100px">
            <div
              data-id="fixed-grandchild"
              style="
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: row;
                align-items: flex-start;
                justify-content: flex-start;
                gap: 0px;
                padding: 0px;
                background-color: #336699;
              "
            ></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
